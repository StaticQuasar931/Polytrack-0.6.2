    <style>
      @font-face{font-family:ForcedSquare;src:url('./forced_square.woff2') format('woff2');font-display:swap}

        --brand:#9ad0ff;
      }
      html, body{ margin:0; height:100%; background:#000; color:#eaf4ff; font-family:ForcedSquare,system-ui,sans-serif; }

      #staticMenu{
        position:fixed; left:12px; top:12px; z-index:9999;
        display:none; gap:0; align-items:stretch; user-select:none;
        padding:0;
        color:#e8f3ff;

        letter-spacing: .1px;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #staticMenu a{
        display:flex;align-items:center;
        min-height:38px;padding:0 14px;
        color:#fff;
        background:#2b3e7a;
        clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);
        font-weight:normal !important;
        text-decoration:none;
        font-family: ForcedSquare, system-ui, sans-serif !important;
      }
      #closeStaticMenu{
        display:flex;align-items:center;justify-content:center;
        min-width:34px;margin-left:-3px;color:#dceaff;cursor:pointer;
        border:0;background:#1c2a59;
        clip-path:polygon(8px 0,100% 0,100% 100%,0 100%);
        font-family: ForcedSquare, system-ui, sans-serif !important;
        font-weight: 800 !important;
      }
      @keyframes menuEnter{ from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:translateY(0)} }

      @media (max-width:600px){
        #staticMenu{ left:8px;top:8px;font-size:12px }
        #staticMenu a{min-height:32px;padding:0 10px}
      }
    </style>

  <body>
    <canvas id="screen"></canvas>
    <div id="ui"></div>
    <div id="transition-layer"></div>

    <div id="staticMenu" role="region" aria-label="StaticQuasar menu">
      <a href="https://sites.google.com/view/staticquasar931/gm3z" target="_blank" rel="noopener">Static's Games</a>
      <span id="closeStaticMenu" title="Hide temporarily">X</span>
    </div>

    <script>
      window.onbeforeunload = () => "Are you sure you want to leave? Your session may be interrupted.";

      (function(){
        const menu = document.getElementById("staticMenu");
        const btn = document.getElementById("closeStaticMenu");
        const KEY = "sq931_staticMenu_hidden_until";
        const hideFor3m = () => {
          if (!menu) return;
          menu.style.display = "none";
          const until = Date.now() + 180000;
          localStorage.setItem(KEY, String(until));
          window.dispatchEvent(new Event('sq-preferences-changed'));
        };
        if (btn) btn.onclick = hideFor3m;
      })();

      (function(){
        const idsToToggle = ["staticMenu"];
        let seq = [];
        const target = ["y","u","i"];
        function toggle(){
          idsToToggle.forEach(id => {
            const el = document.getElementById(id);
            if(!el) return;
            const isHidden = (el.style.display === "none" || getComputedStyle(el).display === "none");
            el.style.display = isHidden ? "flex" : "none";
          });
        }
        window.addEventListener("keydown", e => {
          seq.push(String(e.key || "").toLowerCase());
          if (seq.length > 3) seq.shift();
          if (seq.join("") === target.join("")) toggle();
        });
      })();
    </script>

    <noscript>PolyTrack 0.6.2 Ranked requires JavaScript. Race 17 official and 61 bundled community tracks, save personal best replays, and compete in StaticQuasar931 community rankings.</noscript>
    <script>
      (function(){
        const MENU_KEY = 'sq931_staticMenu_hidden_until';
        const menu = document.getElementById('staticMenu');
        if (!menu) return;

        function isVisible(el){
          if (!el) return false;
          const style = getComputedStyle(el);
          if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity || '1') < 0.05) return false;
          const rect = el.getBoundingClientRect();
          return rect.width > 20 && rect.height > 20;
        }

        function inLobby(){
          const menuRoot = document.querySelector('.menu-ui, .menu');
          const mainButtons = document.querySelector('.main-buttons-container');
          const play = mainButtons && Array.from(mainButtons.querySelectorAll('button,a')).find((button)=>/play/i.test(`${button.textContent||''} ${Array.from(button.querySelectorAll('img')).map((image)=>image.src||'').join(' ')}`));
          return isVisible(menuRoot) && isVisible(mainButtons) && isVisible(play);
        }

        function staticMenuAllowed(){
          const until = parseInt(localStorage.getItem(MENU_KEY) || '0', 10);
          return !until || Date.now() >= until;
        }

        function syncLobbyWidgets(){
          const lobby = inLobby();
          const extrasEnabled = localStorage.getItem('polytrack-0.6.2-lobby-extras') !== '0';
          menu.style.display = lobby && extrasEnabled && staticMenuAllowed() ? 'flex' : 'none';
        }

        syncLobbyWidgets();
        setInterval(syncLobbyWidgets, 250);
        const observer = new MutationObserver(syncLobbyWidgets);
        observer.observe(document.documentElement, { subtree:true, childList:true, attributes:true, attributeFilter:['class','style'] });
        window.addEventListener('focus', syncLobbyWidgets);
        window.addEventListener('sq-preferences-changed', syncLobbyWidgets);
      })();
    </script>
